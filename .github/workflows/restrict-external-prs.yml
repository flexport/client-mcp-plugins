name: Restrict external PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  block-external-prs:
    if: |
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    runs-on: light
    steps:
      - name: Close PR and explain contribution policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Thanks for your interest! This repository doesn't accept pull requests from outside Flexport. Please open an issue instead describing the change you'd like to see, and a maintainer will follow up."
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
